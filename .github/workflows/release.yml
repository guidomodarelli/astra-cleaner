name: Release

# Pushing a `vX.Y.Z` tag on a commit of `main` publishes that version to npm through trusted publishing (OIDC).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verificar el tag del release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release no autorizado::$1"; exit 1; }
          package_version="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "v$package_version" ]] || fail "El tag $RELEASE_TAG no coincide con la versión $package_version de package.json."
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || fail "El commit de $RELEASE_TAG no está en origin/main."
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Instalar el cliente npm para trusted publishing
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run ci
      - name: Publicar en npm
        run: npm publish --access public
